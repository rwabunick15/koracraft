<!DOCTYPE html>
<html lang="en">
<link rel="icon" type="image/png" sizes="32x32" href="crop.png?v=2">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>KoraCraft Admin Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="dashboard">

    <header>

        <div>

            <h1>KoraCraft</h1>

            <p>Administration Dashboard</p>

        </div>

        <button
            id="logoutBtn"
            class="logout-btn">

            Logout

        </button>

    </header>

    <section class="stats">

        <div class="card">

            <h3>Total Requests</h3>

            <h2 id="totalRequests">0</h2>

        </div>

        <div class="card">

            <h3>New</h3>

            <h2 id="newRequests">0</h2>

        </div>

        <div class="card">

            <h3>Contacted</h3>

            <h2 id="contactedRequests">0</h2>

        </div>

        <div class="card">

            <h3>Completed</h3>

            <h2 id="completedRequests">0</h2>

        </div>

    </section>

    <section class="toolbar">

        <input
            type="text"
            id="searchInput"
            placeholder="Search by client, email or website..."
        >

        <select id="statusFilter">

            <option value="All">All Statuses</option>

            <option value="New">New</option>

            <option value="Contacted">Contacted</option>

            <option value="In Progress">In Progress</option>

            <option value="Completed">Completed</option>

            <option value="Cancelled">Cancelled</option>

        </select>

    </section>

    <table>

        <thead>

            <tr>

                <th>ID</th>

                <th>Client</th>

                <th>Email</th>

                <th>Website</th>

                <th>Status</th>

                <th>Date</th>

                <th>Delete</th>

            </tr>

        </thead>

        <tbody id="requestsTable">

        </tbody>

    </table>
    <!-- Request Details Modal -->
<div id="requestModal" class="request-modal">
    <div class="request-modal-content">

        <button id="closeModal" class="close-modal">&times;</button>

        <h2>Request Details</h2>
        <p class="request-id" id="modalRequestId"></p>

        <div class="details-grid">

            <div class="detail-item">
                <span>Full Name</span>
                <strong id="modalName"></strong>
            </div>

            <div class="detail-item">
                <span>Company</span>
                <strong id="modalCompany"></strong>
            </div>

            <div class="detail-item">
                <span>Email</span>
                <strong id="modalEmail"></strong>
            </div>

            <div class="detail-item">
                <span>Phone</span>
                <strong id="modalPhone"></strong>
            </div>

            <div class="detail-item">
                <span>Website Type</span>
                <strong id="modalWebsite"></strong>
            </div>

            <div class="detail-item">
                <span>Budget</span>
                <strong id="modalBudget"></strong>
            </div>

            <div class="detail-item">
                <span>Timeline</span>
                <strong id="modalTimeline"></strong>
            </div>

            <div class="detail-item">
                <span>Status</span>
                <strong id="modalStatus"></strong>
            </div>

        </div>

        <div class="description-box">
            <span>Project Description</span>
            <p id="modalDescription"></p>
        </div>

        <div class="modal-date">
            <span>Submitted</span>
            <strong id="modalDate"></strong>
        </div>

    </div>
</div>

</div>

<script src="script.js"></script>

</body>

</html>
